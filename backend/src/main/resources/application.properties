spring.application.name=monitoriza

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/monitoriza_db
spring.datasource.username=root
spring.datasource.password=

# 'create' borra la BD vieja al iniciar y la crea de cero
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Simulador: true = inserta medición cada 5 min; false = apagado (cuando tengas el ESP8266 real)
app.simulador.mediciones.enabled=true
# Histórico mensual (solo si medicion está vacía; rango = 1 mes hasta el último slot de 5 min)
app.seed.historico.enabled=true
app.seed.historico.intervalo-minutos=5
app.seed.historico.hora-inicio=07:30
app.seed.historico.hora-fin=16:30
app.seed.historico.solo-laboral=true
# Informes históricos al arranque (un informe por día hábil con mediciones en el rango del seed)
app.seed.informes.enabled=true

# Informe diario automático (16:35 lun-vie, complementa el seed al operar 24/7)
app.informe.diario.enabled=true
# Pausa entre informes al seed (evita error 429 RPM en tier gratuito de Gemini)
app.informe.seed.pausa-ms=6000

# Chat IA (contexto compacto, límites free tier)
app.chat.enabled=true
app.chat.max-mensajes-por-dia=30
app.chat.max-mensajes-por-minuto=3
app.chat.informes-patrones-max=15
app.chat.max-output-tokens=512
# Opcional: modelo más liviano solo para chat (vacío = usa gemini.model)
# gemini.chat.model=gemini-2.5-flash-lite

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs

# Obtener la key en https://aistudio.google.com/apikey
# No subir la key al repo: definir variable de entorno GEMINI_API_KEY
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash